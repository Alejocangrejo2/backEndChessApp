# ============================================
# application.properties — Configuración Spring Boot
# ============================================
# Usa variables de entorno para producción (Railway),
# con valores por defecto para desarrollo local (Docker Compose).

# === Servidor ===
server.port=${PORT:8080}

# === PostgreSQL ===
# En Railway: usa DATABASE_URL como variable de entorno
# En local: usa los valores por defecto (Docker Compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chessdb}
spring.datasource.username=${DB_USERNAME:chessuser}
spring.datasource.password=${DB_PASSWORD:chesspass123}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# === Jackson (JSON) ===
spring.jackson.serialization.write-dates-as-timestamps=false

# === JWT ===
# Clave secreta para firmar tokens JWT (cambiar en producción)
jwt.secret=${JWT_SECRET:ChessMasterSecretKey2025SuperSecureKey256BitsMinimumRequiredHere!}
# Expiración del token: 24 horas (en milisegundos)
jwt.expiration=${JWT_EXPIRATION:86400000}

# === CORS ===
# En producción: agregar la URL real del frontend en Vercel
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
